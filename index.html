<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F5E6E">
<title>桃e藥師教學歷程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%23C93A64'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='serif'%3E%E6%A1%83%3C/text%3E%3C/svg%3E">
<style>
/* ===== 設計語彙：藥局調劑核對章（桃紅）× 醫院藥劑科青綠 ===== */
:root{
  --paper:#F6F9F9; --sheet:#FFFFFF; --wash:#E3F0F2; --wash-2:#EEF5F6;
  --ink:#10313B; --ink-2:#45606A; --ink-3:#5E757D; --rule:#D3E0E3; --rule-2:#E6EEF0;
  --teal:#0F5E6E; --teal-deep:#0A3F4B; --teal-soft:#CFE4E8;
  --seal:#C93A64; --peach:#B8305A; --peach-wash:#FCE8EE;
  --warn:#8A4B00; --warn-soft:#FDF1E2; --err:#A3261D; --err-soft:#FBE9E7; --ok:#2B6A4B; --ok-soft:#E4F2EA;
  --focus:#0B67C2;
  --display:"LXGW WenKai TC","Kaiti TC","STKaiti","DFKai-SB","標楷體",serif;
  --body:"PingFang TC","Noto Sans TC","Microsoft JhengHei","微軟正黑體",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:6px; --r-md:10px; --r-lg:16px;
  --nav-h:64px; --top-h:56px;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.65 var(--body);-webkit-font-smoothing:antialiased;font-feature-settings:"palt" 0}
a{color:var(--teal);text-underline-offset:2px}
a:hover{color:var(--teal-deep)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
[hidden]{display:none!important}
.display{font-family:var(--display);font-weight:700;letter-spacing:.02em}

/* ===== 核對章（品牌） ===== */
.seal{--s:44px;width:var(--s);height:var(--s);flex:0 0 var(--s);display:grid;place-items:center;background:var(--seal);color:#fff;
  border-radius:calc(var(--s)*.22);font-family:var(--display);font-weight:700;font-size:calc(var(--s)*.58);line-height:1;
  box-shadow:inset 0 0 0 calc(var(--s)*.06) rgba(255,255,255,.9),inset 0 0 0 calc(var(--s)*.1) var(--seal);transform:rotate(-4deg)}
.seal.small{--s:32px}
.seal.huge{--s:132px}
.stamped .seal{animation:stamp .5s var(--ease) both}
@keyframes stamp{0%{transform:rotate(-4deg) scale(1.35);opacity:.2}55%{transform:rotate(-4deg) scale(.92);opacity:1}100%{transform:rotate(-4deg) scale(1)}}

/* ===== 登入 ===== */
.login{min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:auto 1fr;background:var(--teal-deep)}
.login-stage{position:relative;color:#fff;padding:calc(48px + env(safe-area-inset-top)) 24px 40px;overflow:hidden}
.login-stage::after{content:"";position:absolute;inset:auto -10% -1px -10%;height:48px;background:var(--paper);border-radius:50% 50% 0 0/100% 100% 0 0}
.login-stage .inner{max-width:480px;margin:0 auto;position:relative;z-index:1}
.login-stage h1{font-family:var(--display);font-weight:700;font-size:clamp(2.1rem,8vw,3.2rem);line-height:1.2;margin:28px 0 10px;letter-spacing:.04em}
.login-stage p{margin:0;color:#CFE4E8;font-size:1.02rem;max-width:30em}
.login-rx{position:absolute;right:-24px;top:8px;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:220px;line-height:1;color:rgba(255,255,255,.06);user-select:none;pointer-events:none}
.login-panel{background:var(--paper);padding:8px 24px 40px}
.login-box{max-width:480px;margin:0 auto;width:100%}
.login-box h2{font-family:var(--display);font-weight:700;font-size:1.7rem;margin:0 0 6px;letter-spacing:.03em}
.login-box .hint{color:var(--ink-3);font-size:.92rem;margin:0 0 18px}
#gsiBtn{min-height:48px}
#gsiBtn>button{width:100%;min-height:48px;border:0;border-radius:var(--r-md);background:var(--teal);color:#fff;font-weight:600;cursor:pointer}
.login-what{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:12px}
.login-what li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;color:var(--ink-2);font-size:.92rem}
.login-what svg{width:36px;height:36px;padding:7px;border-radius:var(--r-md);background:var(--wash);color:var(--teal)}
.msg{margin-top:16px;padding:12px 14px;border-radius:var(--r-md);font-size:.95rem;border-left:4px solid}
.msg.err{background:var(--err-soft);color:var(--err);border-color:var(--err)}
.msg.info{background:var(--wash);color:var(--teal-deep);border-color:var(--teal)}
.login-foot{max-width:480px;margin:28px auto 0;font-size:.82rem;color:var(--ink-3);border-top:1px solid var(--rule);padding-top:14px}
@media(min-width:900px){
  .login{grid-template-rows:none;grid-template-columns:minmax(380px,46%) 1fr}
  .login-stage{display:flex;align-items:center;padding:64px}
  .login-stage::after{inset:-10% -1px -10% auto;width:56px;height:auto;border-radius:100% 0 0 100%/50% 0 0 50%}
  .login-panel{display:flex;align-items:center;padding:64px}
  .login-box,.login-foot{margin-left:0}
  .login-rx{font-size:340px;right:-40px;top:auto;bottom:-40px}
}

/* ===== 主框架 ===== */
.top{position:sticky;top:0;z-index:30;background:rgba(246,249,249,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top)}
.top-bar{height:var(--top-h);max-width:1360px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand b{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{display:flex;align-items:center;gap:8px;min-width:0}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--wash);color:var(--teal-deep);display:grid;place-items:center;font-weight:700;font-size:.9rem;flex:0 0 34px}
.who{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.who b{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.who span{font-size:.75rem;color:var(--ink-3)}
.role{display:inline-block;padding:0 6px;border-radius:4px;background:var(--wash);color:var(--teal-deep);font-size:.72rem;margin-right:4px}
.role.learner{background:var(--peach-wash);color:var(--peach)}
.iconbtn{border:0;background:none;min-width:44px;height:44px;border-radius:var(--r-md);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.iconbtn:hover{background:var(--wash-2);color:var(--ink)}
.iconbtn svg{width:22px;height:22px}
@media(max-width:560px){.who{display:none}}

.shell{max-width:1360px;margin:0 auto}
main{min-width:0;padding:0 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom))}

/* 導覽：手機底部；桌機左側 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:35;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:var(--sheet);border-top:1px solid var(--rule);display:flex}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink-3);font-size:.78rem;cursor:pointer;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--teal)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--teal)}
@media(min-width:900px){
  .shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:0}
  .nav{position:sticky;top:calc(var(--top-h) + 1px);height:calc(100vh - var(--top-h) - 1px);flex-direction:column;justify-content:flex-start;gap:4px;
    border-top:0;border-right:1px solid var(--rule);background:transparent;padding:20px 12px}
  .tab{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:10px;padding:10px 12px;border-radius:var(--r-md);font-size:.95rem}
  .tab:hover{background:var(--wash-2)}
  .tab[aria-selected="true"]{background:var(--wash);color:var(--teal-deep);font-weight:600}
  .tab[aria-selected="true"]::before{top:10px;bottom:10px;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
  main{padding:0 28px 48px}
}

/* ===== 搜尋 ===== */
.searchbar{position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top) + 1px);z-index:20;background:var(--paper);padding:14px 0 10px;display:grid;gap:8px}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--ink-3);pointer-events:none}
.searchbox input{width:100%;font-size:1.02rem;height:52px;padding:0 48px 0 44px;border:1.5px solid var(--rule);border-radius:var(--r-lg);background:var(--sheet);transition:border-color .15s,box-shadow .15s}
.searchbox input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(15,94,110,.14)}
.searchbox input::placeholder{color:var(--ink-3)}
.searchbox input::-webkit-search-cancel-button,.searchbox input::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
.searchbox .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
.scope{display:flex;gap:8px;align-items:center}
.scope select{flex:1;min-width:0;height:40px;font-size:.92rem;padding:0 10px;border:1px solid var(--rule);border-radius:var(--r-md);background:var(--sheet)}
@media(min-width:900px){.searchbar{grid-template-columns:1fr 320px;padding-top:20px}}
.progress{font-size:.8rem;color:var(--ink-3);margin:2px 0 6px}
.bar{height:3px;background:var(--rule-2);border-radius:3px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--teal);width:0;transition:width .4s var(--ease)}
.status{color:var(--ink-2);font-size:.9rem;margin:6px 0 12px}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r-md);padding:0 16px;min-height:44px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-deep)}
.btn.small{min-height:36px;padding:0 12px;font-size:.9rem}
.state{padding:40px 16px;text-align:center;color:var(--ink-2)}
.state.err{color:var(--err)}
.state .btn{margin-top:14px}
.state b{display:block;font-family:var(--display);font-size:1.25rem;color:var(--ink);margin-bottom:4px}

/* ===== 藥櫃（分頁目錄） ===== */
.cabinet-intro{font-family:var(--display);font-size:clamp(1.5rem,5vw,2.1rem);font-weight:700;margin:18px 0 2px;letter-spacing:.03em}
.cabinet-sub{color:var(--ink-3);margin:0 0 18px;font-size:.92rem}
.cabinet-key{display:flex;flex-wrap:nowrap;gap:6px;margin:0 -16px 12px;padding:0 16px 2px;overflow-x:auto;scrollbar-width:none}
.cabinet-key::-webkit-scrollbar{display:none}
.cabinet-key{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);padding-right:40px}
.cabinet-key button{flex:0 0 auto;white-space:nowrap}
.cabinet-key button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:4px 12px;min-height:36px;font-size:.84rem;color:var(--ink-2);cursor:pointer}
.cabinet-key button:hover{border-color:var(--ink-3);color:var(--ink)}
.cabinet-key i{width:10px;height:10px;border-radius:2px;display:inline-block}
.dir-group{margin:0 0 24px}
.dir-group h2{font-size:.88rem;color:var(--ink-2);font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.dir-group h2 i{width:10px;height:10px;border-radius:2px;display:inline-block}
.cabinet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px;background:var(--wash);border-radius:var(--r-lg)}
@media(min-width:640px){.cabinet{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1100px){.cabinet{grid-template-columns:repeat(4,minmax(0,1fr))}}
.drawer-card{position:relative;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-sm);padding:16px 14px 12px;cursor:pointer;min-height:96px;
  display:flex;flex-direction:column;justify-content:space-between;gap:10px;transition:transform .12s var(--ease),box-shadow .12s}
.drawer-card::before{content:"";position:absolute;left:30%;right:30%;top:9px;height:9px;border-radius:0 0 8px 8px;background:var(--tab,var(--teal-soft));opacity:.9}
.drawer-card .tag{position:absolute;right:8px;top:6px;font-size:.7rem;color:var(--ink-3);background:var(--wash-2);border-radius:4px;padding:0 5px;line-height:1.6}
.drawer-card b{font-family:var(--display);font-size:1.12rem;line-height:1.3;font-weight:700;word-break:break-word;margin-top:12px}
.drawer-card small{color:var(--ink-3);font-size:.78rem;display:flex;justify-content:space-between;gap:6px}
.drawer-card small em{font-style:normal;color:var(--ink-2);font-variant-numeric:tabular-nums}
.drawer-card:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(10,63,75,.10)}
.drawer-card:active{transform:translateY(1px)}
.drawer-card:disabled{cursor:default;opacity:.6;transform:none;box-shadow:none}
.drawer-card .own{color:var(--peach)}
.rolesel{font:inherit;font-size:.8rem;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);max-width:9.5rem}
.chart-meta{margin:.5rem 0 0;font-size:.74rem;color:var(--ink-3);line-height:1.5}
.supp{color:var(--ink-3);font-style:normal;font-size:.8rem}
.state.supp-state{border:1px dashed var(--line);background:var(--wash)}
.imp table{width:100%;border-collapse:collapse;font-size:.85rem}.imp th,.imp td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.imp .bad{color:#9b2c2c}

/* ===== 結果列表 ===== */
.results{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-lg);overflow:hidden}
.row-item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule-2);padding:14px 16px;cursor:pointer}
.row-item:last-child{border-bottom:0}
.row-item:hover{background:var(--wash-2)}
.row-item .t{font-weight:600;font-size:1rem;line-height:1.45;word-break:break-word}
.row-item .s{color:var(--ink-2);font-size:.9rem;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.row-item .src{font-size:.76rem;color:var(--ink-3);margin-top:6px;display:flex;align-items:center;gap:6px}
.row-item .src i{width:8px;height:8px;border-radius:2px;display:inline-block}
mark{color:inherit;background:linear-gradient(transparent 52%,#F8C9D7 52%);padding:0 1px;border-radius:1px}
.more{margin:16px auto 0;display:block}
.skel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-lg);overflow:hidden}
.skel div{height:70px;border-bottom:1px solid var(--rule-2);background:linear-gradient(90deg,var(--sheet) 0,var(--wash-2) 50%,var(--sheet) 100%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* 表格模式 */
.tablewrap{overflow:auto;-webkit-overflow-scrolling:touch;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-lg);max-height:72vh}
table.grid{border-collapse:separate;border-spacing:0;font-size:.88rem;min-width:100%}
table.grid th,table.grid td{border-bottom:1px solid var(--rule-2);border-right:1px solid var(--rule-2);padding:8px 10px;vertical-align:top;text-align:left}
table.grid thead th{position:sticky;top:0;background:var(--wash);z-index:2;white-space:nowrap;font-weight:600;color:var(--teal-deep)}
table.grid tbody td:first-child{position:sticky;left:0;background:var(--sheet);z-index:1;font-weight:600}
table.grid thead th:first-child{left:0;z-index:3}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:hover td{background:var(--wash-2)}
table.grid td{max-width:320px}

/* ===== 互動教材 ===== */
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;padding-top:18px}
.page-card{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-lg);padding:16px;text-align:left;cursor:pointer}
.page-card:hover{border-color:var(--teal)}
.page-card .ic{width:44px;height:44px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--wash);color:var(--teal)}
.page-card .ic.calc{background:var(--peach-wash);color:var(--peach)}
.page-card .ic svg{width:24px;height:24px}
.page-card b{display:block;font-family:var(--display);font-size:1.15rem;line-height:1.35}
.page-card p{margin:4px 0 0;color:var(--ink-2);font-size:.9rem}
.page-card small{color:var(--ink-3);font-size:.78rem}

/* ===== 詳細（手機下方抽屜；桌機右側） ===== */
.scrim{position:fixed;inset:0;background:rgba(10,40,50,.38);z-index:40;animation:fade .18s ease-out}
.drawer{position:fixed;z-index:41;background:var(--sheet);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(10,40,50,.18);
  left:0;right:0;bottom:0;max-height:94vh;max-height:94dvh;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom);animation:rise .24s var(--ease)}
.drawer::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--rule);margin:8px auto 0;flex:0 0 auto}
@media(min-width:900px){
  .drawer{left:auto;top:0;bottom:0;width:min(760px,56vw);max-height:none;border-radius:0;animation:slide .24s var(--ease)}
  .drawer::before{display:none}
}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer-head{display:flex;gap:10px;align-items:flex-start;padding:12px 16px 12px 20px;border-bottom:1px solid var(--rule-2)}
.drawer-head h2{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.35;margin:0;flex:1;word-break:break-word;letter-spacing:.02em}
.drawer-head .crumb{display:flex;align-items:center;gap:6px;font-family:var(--body);font-size:.78rem;color:var(--ink-3);font-weight:400;margin-bottom:4px;letter-spacing:0}
.drawer-head .crumb i{width:8px;height:8px;border-radius:2px;display:inline-block}
.drawer-body{overflow:auto;padding:4px 20px 20px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.drawer-foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--rule-2)}
.drawer-foot .btn{width:100%}
.drawer-foot .status{margin:0;font-variant-numeric:tabular-nums}
.field{display:grid;grid-template-columns:1fr;gap:2px;padding:12px 0;border-bottom:1px dashed var(--rule)}
.field:last-child{border-bottom:0}
.field dt{font-size:.78rem;color:var(--ink-3)}
.field dd{margin:0;word-break:break-word;line-height:1.7}
@media(min-width:900px){.field{grid-template-columns:200px minmax(0,1fr);gap:20px}.field dt{padding-top:3px}}
.cell-text{white-space:pre-wrap}
.cell-html{overflow-x:auto}
.cell-html table{border-collapse:collapse;margin:4px 0}
.cell-html td,.cell-html th{border:1px solid var(--rule);padding:4px 6px}
.cell-html img,.embed img{max-width:100%;height:auto;border-radius:var(--r-sm)}
.embed{margin:10px 0;border:1px solid var(--rule);border-radius:var(--r-md);overflow:hidden;background:var(--wash-2)}
.embed iframe{display:block;width:100%;border:0;background:#fff}
.embed .cap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;font-size:.84rem;color:var(--ink-2);background:var(--sheet)}
.yt{position:relative;aspect-ratio:16/9;width:100%;background:#0A3F4B;border:0;padding:0;cursor:pointer;display:block}
.yt img{width:100%;height:100%;object-fit:cover;opacity:.88}
.yt span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;background:rgba(10,63,75,.88);color:#fff;font-weight:600;padding:10px 16px;border-radius:999px}
.ratio{aspect-ratio:16/9}
.interactive{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border:1px solid var(--teal-soft);border-radius:var(--r-md);background:var(--wash);margin:6px 0}
.interactive span{font-weight:600;color:var(--teal-deep)}
.slide-frame{position:relative;background:#0B2A33}
.slide-frame::before{content:"簡報載入中…（若一直空白：檔案需設為「知道連結的使用者可檢視」）";position:absolute;inset:0;display:grid;place-items:center;padding:16px;text-align:center;color:#9FBFC6;font-size:.84rem}
.slide-frame iframe{position:relative;background:transparent}
.slide-card{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--teal-soft);border-radius:var(--r-md);background:linear-gradient(135deg,var(--wash),var(--sheet));margin:8px 0}
.slide-card .ic{width:44px;height:44px;border-radius:var(--r-md);background:var(--teal);color:#fff;display:grid;place-items:center}
.slide-card .ic svg{width:22px;height:22px}
.slide-card b{display:block;font-size:.95rem;line-height:1.35;word-break:break-word}
.slide-card small{color:var(--ink-3);font-size:.78rem}

/* ===== 全螢幕檢視（互動網頁、簡報） ===== */
.viewer{position:fixed;inset:0;z-index:60;background:var(--sheet);display:flex;flex-direction:column}
.viewer.stage{background:#0B2A33}
.viewer-head{display:flex;align-items:center;gap:6px;padding:6px 8px;padding-top:calc(6px + env(safe-area-inset-top));border-bottom:1px solid var(--rule)}
.viewer.stage .viewer-head{border-color:rgba(255,255,255,.1);color:#fff}
.viewer.stage .iconbtn{color:#CFE4E8}
.viewer.stage .iconbtn:hover{background:rgba(255,255,255,.08);color:#fff}
.viewer-head b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--display);font-weight:700;font-size:1.05rem}
.viewer iframe{flex:1;width:100%;border:0;background:#fff}
.viewer.stage iframe{background:#0B2A33}
.viewer .loading{flex:1;display:grid;place-items:center;color:var(--ink-2)}
.viewer.stage .loading{color:#CFE4E8}
.viewer .modbar{padding:6px 12px;font-size:.8rem;line-height:1.45;background:var(--peach-wash);color:var(--ink);border-bottom:1px solid var(--rule)}
.viewer .modbar b{font-weight:700}
.viewer .modbar.trial{background:#FBEAE8;color:#7A1F17}
.viewer .modbar .warn{display:block;font-weight:700}
.viewer .note{font-size:.76rem;color:#9FBFC6;text-align:center;padding:6px 12px calc(6px + env(safe-area-inset-bottom))}

/* ===== 儀表板 ===== */
.viz{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;
  --q1:#DCEFF1;--q2:#B4DCE1;--q3:#7FC0C9;--q4:#3F98A6;--q5:#0F5E6E;--grid:#E6EEF0}
.dash-top{position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top) + 1px);z-index:20;background:var(--paper);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 0 10px}
.dash-top select{height:44px;font-size:.95rem;padding:0 10px;border:1px solid var(--rule);border-radius:var(--r-md);background:var(--sheet)}
.dash-top .grow{flex:1 1 100%;min-width:0;font-weight:600}
.dash-top #yearSel,.dash-top #monthSel{flex:1 1 0;min-width:0}
@media(min-width:900px){.dash-top .grow{flex:1 1 320px}.dash-top #yearSel,.dash-top #monthSel{flex:0 0 180px}}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:14px}
.chart{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-lg);padding:16px;min-width:0}
.chart.wide{grid-column:1/-1}
.chart.kpi-card{display:flex;flex-direction:column}
.chart-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chart-head h3{font-size:1rem;margin:0;flex:1;min-width:150px;line-height:1.4}
.chart-head select{height:36px;font-size:.88rem;padding:0 8px;border:1px solid var(--rule);border-radius:var(--r-sm);max-width:100%;background:var(--sheet)}
.chart .desc{font-size:.8rem;color:var(--ink-3);margin:-6px 0 10px}
.self-tone .kpi{color:var(--seal)}
.kpi{font-family:var(--display);font-size:3.2rem;font-weight:700;line-height:1;color:var(--teal-deep);font-variant-numeric:tabular-nums;margin-top:auto}
.kpi small{display:block;font-family:var(--body);font-size:.85rem;font-weight:400;color:var(--ink-3);margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem;color:var(--ink-2);margin:0 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hbars{display:grid;gap:7px}
.hb-group{display:grid;gap:3px;padding-bottom:6px}
.hb-label{font-size:.86rem;color:var(--ink);word-break:break-word;line-height:1.35}
.hb-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.hb-track{height:14px;position:relative;background:linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/25% 100%}
.hb-bar{height:100%;border-radius:0 4px 4px 0;min-width:2px}
.hb-val{font-size:.8rem;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:3.4em;text-align:right}
.hb-single .hb-row{grid-template-columns:minmax(96px,36%) 1fr auto}
.hb-block{font-weight:600;font-size:.88rem;color:var(--teal-deep);margin-top:8px;padding-top:8px;border-top:1px solid var(--rule-2)}
.hb-block:first-child{margin-top:0;padding-top:0;border-top:0}
.self-tone .hb-block{color:var(--peach)}
.vbars{display:flex;align-items:flex-end;gap:8px;height:200px;border-bottom:1px solid var(--rule);padding-top:18px}
.vb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.vb .bar{width:70%;max-width:52px;border-radius:4px 4px 0 0;min-height:2px}
.vb .v{font-size:.78rem;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-bottom:2px}
.vlabels{display:flex;gap:8px;margin-top:6px}
.vlabels span{flex:1;font-size:.76rem;color:var(--ink-2);text-align:center;word-break:break-word;min-width:0}
.trend svg{display:block;width:100%;height:auto}
.trend text{font-size:11px;fill:var(--ink-3);font-family:var(--body)}
.mtx{overflow:auto;max-height:70vh;border-radius:var(--r-sm)}
.mtx table{border-collapse:separate;border-spacing:2px;font-size:.84rem;min-width:100%}
.mtx th,.mtx td{padding:6px 8px;text-align:center;white-space:nowrap;border-radius:3px}
.mtx thead th{position:sticky;top:0;background:var(--wash);z-index:1;white-space:normal;min-width:64px;font-weight:600;color:var(--teal-deep);font-size:.78rem;line-height:1.3}
.mtx tbody th{text-align:left;background:var(--wash-2);position:sticky;left:0;font-weight:600;white-space:normal;min-width:120px;z-index:1}
.mtx td{background:var(--wash-2);font-variant-numeric:tabular-nums}
.mtx td.empty{background:transparent;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--rule);outline:1px dashed var(--rule);outline-offset:-4px}
.mtx-scale{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-size:.74rem;color:var(--ink-2)}
.mtx-scale i{display:block;width:140px;height:8px;border-radius:4px}
.mtx-scale em{font-style:normal;color:var(--ink-3);margin-left:8px}
.mtx td .delta{display:block;font-size:.7rem;line-height:1.2;opacity:.9}
.mtx-sum{margin:0 0 10px;padding:10px 12px;border-radius:var(--r-md);background:var(--wash);color:var(--teal-deep);font-weight:600;font-size:.92rem}
.self-tone .mtx-sum{background:var(--peach-wash);color:var(--peach)}
.mtx-key{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:2px 16px;font-size:.78rem;color:var(--ink-2)}
.mtx-key b{color:var(--teal-deep);margin-right:2px}

/* CBME 進展矩陣 */
.charts>.chart,.chart>div,.prog,.mtx-sections,.mtx-sec{min-width:0;max-width:100%}
.prog-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 10px}
.prog-lab{font-size:.78rem;color:var(--ink-3)}
.seg{display:inline-flex;background:var(--wash-2);border:1px solid var(--rule);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;min-width:40px;min-height:32px;padding:0 10px;border-radius:999px;font:600 .82rem var(--body);color:var(--ink-2);cursor:pointer;font-variant-numeric:tabular-nums}
.seg button:hover{color:var(--ink);background:var(--sheet)}
.seg button[aria-checked="true"]{background:var(--teal-deep);color:#fff;box-shadow:0 1px 3px rgba(10,63,75,.25)}
.prog-hint{font-size:.78rem;color:var(--ink-3);flex:1 1 240px}
.prog-sum{font-weight:500;font-size:.86rem;font-variant-numeric:tabular-nums}
.prog .mtx tbody th{min-width:180px;max-width:260px;line-height:1.35}
.prog .mtx tbody th b{display:inline-block;font:700 .72rem ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--teal-deep);background:var(--sheet);border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:1px}
.prog .mtx tbody th span{font-weight:600}
.prog .mtx td{min-width:76px;padding:6px 6px 4px;vertical-align:middle}
.prog .mtx td .pv{display:block;font-weight:600}
.prog .stair{display:block;width:44px;height:14px;margin:3px auto 0;overflow:visible}
.prog .stair rect{fill:currentColor;opacity:.38}
.prog .stair rect.on{opacity:1}
.prog .stair rect.na{opacity:.15}
.prog .mtx td.dlt{background:transparent;font-weight:700;font-size:.82rem;min-width:56px}
.prog .mtx td.dlt.up{color:var(--ok)} .prog .mtx td.dlt.down{color:var(--err)} .prog .mtx td.dlt.flat{color:var(--ink-3)}
.prog .mtx tr.fam th{background:transparent;position:static;font:700 .86rem var(--display);color:var(--ink);padding:12px 4px 4px;letter-spacing:.02em}
.prog .mtx tr.avg th,.prog .mtx tr.avg td{background:var(--wash);font-weight:700;color:var(--teal-deep);border-top:2px solid var(--rule)}
.prog .mtx td.supp{font-size:.74rem;color:var(--ink-3)}
.prog .mtx tbody tr:not(.fam):hover th{background:var(--wash);color:var(--teal-deep)}
.mtx-sections{display:grid;gap:18px}
.mtx-sec h4{margin:0 0 8px;font-family:var(--display);font-size:1rem;display:flex;align-items:baseline;gap:8px;color:var(--ink)}
.mtx-sec .mtx table{table-layout:fixed}
.mtx-sec .mtx thead th:first-child,.mtx-sec .mtx tbody th{width:34%}
@media(max-width:560px){.mtx-sec .mtx table{table-layout:auto;min-width:560px}.prog .mtx tbody th{min-width:112px;max-width:132px;font-size:.78rem}.prog .mtx td{min-width:62px}.prog .mtx tbody th b{display:block;width:max-content;margin:0 0 2px}}
.mtx-sec h4 span{font:500 .74rem var(--body);color:var(--ink-3)}
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory}
.kcol{flex:0 0 min(78vw,260px);background:var(--wash-2);border-radius:var(--r-md);padding:8px;max-height:70vh;overflow:auto;scroll-snap-align:start}
.kcol h4{margin:2px 4px 8px;font-size:.9rem;display:flex;justify-content:space-between}
.kcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-sm);padding:8px 10px;margin-bottom:6px;font-size:.85rem}
.kcard div{word-break:break-word}
.kcard span{color:var(--ink-3)}
.kcard .kline{padding:4px 0 4px 12px;position:relative;border-bottom:1px solid var(--rule-2)}
.kcard .kline:last-child{border-bottom:0}
.kcard .ksec{margin-top:8px;padding:6px 0 2px 10px;border-left:3px solid var(--rule)}
.kcard .ksec.pos{border-left-color:#2E8B6E}
.kcard .ksec.warn{border-left-color:#C98A1B}
.kcard .ksec.act{border-left-color:var(--teal-deep)}
.kcard .ksec-h{font-size:.74rem;font-weight:700;letter-spacing:.02em;color:var(--ink-2);margin-bottom:2px}
.kcard .ksec.pos .ksec-h{color:#1F6E55}
.kcard .ksec.warn .ksec-h{color:#8A5D0E}
.kmedia{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.kmedia .kplay,.kmedia .kpeek{display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:4px 12px;border-radius:999px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;border:1px solid transparent}
.kmedia .kplay{background:var(--teal-deep);color:#fff}
.kmedia .kplay:hover{background:var(--teal)}
.kmedia .kpeek{background:transparent;color:var(--teal-deep);border-color:var(--rule)}
.kmedia .kpeek:hover{background:var(--wash)}
.kmedia .kplay:focus-visible,.kmedia .kpeek:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.kmedia .kframe{flex-basis:100%;margin-top:6px}
.kcard .klink::before{display:none}
.kcard .klink a{display:inline-flex;align-items:center;gap:4px;margin-top:4px;padding:3px 10px;border-radius:999px;background:var(--wash);color:var(--teal-deep);font-weight:600;text-decoration:none;font-size:.8rem}
.kcard .klink a::before{content:"▶";font-size:.7em}
.kcard .klink a:hover{background:var(--teal);color:#fff}
.kcard .kline::before{content:"";position:absolute;left:0;top:12px;width:5px;height:5px;border-radius:50%;background:var(--teal)}
.kcol{flex-basis:min(92vw,420px)}
.datatable{overflow:auto;margin-top:4px}
.datatable table{border-collapse:collapse;font-size:.84rem;min-width:100%}
.datatable th,.datatable td{border-bottom:1px solid var(--rule-2);padding:6px 8px;text-align:left;font-variant-numeric:tabular-nums}
.datatable thead th{color:var(--ink-3);font-weight:600;font-size:.78rem}
.netnote{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));z-index:50;background:var(--ink);color:#fff;font-size:.86rem;padding:10px 16px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.linkbtn{border:0;background:none;color:var(--teal);cursor:pointer;font-size:.84rem;padding:6px 4px;text-decoration:underline;text-underline-offset:2px;min-height:36px}

/* ===== 成效儀表板：報表頁籤＋切片器＋KPI 列＋視覺格（Power BI 式版面）＋總覽看板 ===== */
.bi-head{position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top) + 1px);z-index:21;background:var(--paper);padding:12px 0 0;margin:0 -2px;display:grid;gap:8px;border-bottom:1px solid var(--rule)}
.bi-cat,.bi-pages,.board-sec,.crumb-up{--cc:var(--teal);--cc-soft:var(--wash)}
:is(.bi-cat,.bi-pages,.board-sec,.crumb-up).p{--cc:var(--seal);--cc-soft:var(--peach-wash)}
:is(.bi-cat,.bi-pages,.board-sec,.crumb-up).c{--cc:#2B6A4B;--cc-soft:#E4F2EA}
:is(.bi-cat,.bi-pages,.board-sec,.crumb-up).m,:is(.bi-cat,.bi-pages,.board-sec,.crumb-up).a{--cc:#4a3aa7;--cc-soft:#ECE9FA}
:is(.bi-cat,.bi-pages,.board-sec,.crumb-up).r{--cc:#8A5D0E;--cc-soft:#FBF1DE}
:is(.bi-cat,.bi-pages,.board-sec,.crumb-up).o{--cc:var(--ink-2);--cc-soft:var(--wash-2)}
.bi-cats,.bi-pages{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-width:0;padding:0 2px;scroll-padding:0 24px}
.bi-cats::-webkit-scrollbar,.bi-pages::-webkit-scrollbar{display:none}
.bi-cats.fade-r,.bi-pages.fade-r{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.bi-cats.fade-l,.bi-pages.fade-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 28px);mask-image:linear-gradient(90deg,transparent,#000 28px)}
.bi-cats.fade-l.fade-r,.bi-pages.fade-l.fade-r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
.bi-cat{flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 12px;border:1px solid var(--rule);border-radius:999px;background:var(--sheet);
  color:var(--ink-2);font-size:.92rem;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.bi-cat::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cc);flex:0 0 8px}
.bi-cat em{font-style:normal;font-size:.72rem;font-variant-numeric:tabular-nums;min-width:20px;text-align:center;padding:1px 6px;border-radius:999px;background:var(--cc-soft);color:var(--cc)}
.bi-cat:hover{border-color:var(--cc);color:var(--ink)}
.bi-cat[aria-selected="true"]{background:var(--cc);border-color:var(--cc);color:#fff;font-weight:700}
.bi-cat[aria-selected="true"]::before{background:#fff}
.bi-cat[aria-selected="true"] em{background:rgba(255,255,255,.22);color:#fff}
.bi-pages{gap:0;margin-top:2px}
.bi-page{flex:0 0 auto;border:0;background:none;padding:10px 12px 9px;font-size:.88rem;color:var(--ink-3);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;min-height:44px}
.bi-page:hover{color:var(--ink)}
.bi-page[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--cc)}
.bi-page.ov{color:var(--cc);font-weight:600}
.bi-page.ov .lbl::before{content:"▦";margin-right:5px;font-size:.8em;opacity:.8}
.bi-head:has(.bi-pages[hidden]){padding-bottom:12px}
.bi-slicers{position:static!important}
.bi-slicers{gap:10px 14px;padding:12px 0}
.slicer{display:flex;flex-direction:column;gap:2px;flex:1 1 140px;min-width:0;max-width:260px}
.slicer>span{font-size:.72rem;color:var(--ink-3);letter-spacing:.04em}
.slicer select{width:100%;height:38px!important;font-size:.9rem!important;flex:none!important}
.charts>.board,.charts>.metrics{grid-column:1/-1}
.slicer:has(select[hidden]){display:none}
.slicer.subj{max-width:340px;flex-basis:220px}
.bi-crumb{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-family:var(--display);font-weight:700;font-size:clamp(1.35rem,3.2vw,1.75rem);color:var(--ink);letter-spacing:.02em;line-height:1.3}
.crumb-up{font:600 .86rem var(--body);letter-spacing:0;color:var(--cc);background:var(--cc-soft);border:0;border-radius:999px;padding:3px 10px;cursor:pointer;align-self:center}
.crumb-up:hover{text-decoration:underline;text-underline-offset:2px}
.crumb-sep{display:none}
.bi-crumb small{flex:1 1 100%;font-family:var(--body);font-weight:400;font-size:.82rem;color:var(--ink-3);letter-spacing:0}
.bi-reset{align-self:flex-end}
.bi-kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 12px}
.bi-kpis:empty{display:none}
.tile{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--teal);border-radius:var(--r-sm);padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:4px}
.tile.self{border-left-color:var(--seal)}
.tile.meta{border-left-color:var(--rule);background:var(--wash-2)}
.tile h3{margin:0;font-size:.78rem;font-weight:600;color:var(--ink-2);line-height:1.35}
.tile .kpi{font-size:2.1rem;margin-top:6px}
.tile .kpi small{font-size:.74rem;margin-top:4px}

.ax-x{margin-left:auto;border:0;background:var(--wash);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:1rem}
.ax-case{font-weight:700;font-size:.85rem;margin-bottom:4px}
.ax-tl{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px}
.ax-tl li{display:grid;gap:2px;padding:10px 12px;border:1px solid var(--rule-2);border-radius:var(--r-md);background:var(--wash-2)}
.ax-tl time{font-size:.72rem;color:var(--ink-3);font-variant-numeric:tabular-nums}

.ax-kpigrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}

.ax-kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--teal)}

.ax-kpi.na{opacity:.75}.ax-kpi.na::before{background:var(--rule)}
.ax-kpi-n{font-size:.8rem;font-weight:700;color:var(--ink-2)}

.ax-kpi-v small{font:600 .78rem var(--body);color:var(--ink-3);margin-left:4px}
.ax-kpi-bar{height:6px;border-radius:999px;background:var(--rule-2);overflow:hidden}
.ax-kpi-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-deep));border-radius:inherit;transition:width .6s var(--ease)}
.ax-kpi.warn .ax-kpi-bar i{background:linear-gradient(90deg,#E0A93A,#C98A1B)}
.ax-kpi-nd{font-size:.72rem;color:var(--ink-3);line-height:1.5}
.ax-kpi-nd b{color:var(--ink);font-variant-numeric:tabular-nums}
.ax-kpi-note{font-size:.72rem;color:#8A5D0E;background:#FBF1DE;border-radius:6px;padding:4px 8px}
/* ===== 臨床成效駕駛艙（CX） ===== */
#dashPanel.cx-mode:not(.cx-showraw) #charts > section.chart[data-title],#dashPanel.cx-mode:not(.cx-showraw) #charts > section.tile{display:none}
#dashPanel.cx-mode #dashKpis,#dashPanel.cx-mode #dashChips,#dashPanel.cx-mode .slicer.subj{display:none}
.cx-root{grid-column:1/-1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;font-variant-numeric:tabular-nums;--cx-good:#2B6A4B;--cx-bad:#A3261D;--cx-warn:#8A4B00}
.cx-root>*{grid-column:1/-1;min-width:0}
.cx-hero{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding:22px 24px;border-radius:var(--r-lg);background:linear-gradient(135deg,#0A3F4B 0%,#0F5E6E 62%,#1C7384 100%);color:#fff;position:relative;overflow:hidden}
.cx-hero::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;border:1px solid rgba(255,255,255,.12);box-shadow:0 0 0 40px rgba(255,255,255,.03),0 0 0 80px rgba(255,255,255,.02);pointer-events:none}
.cx-eyebrow{margin:0 0 4px;font-size:.78rem;letter-spacing:.12em;color:#BFE0E5;font-weight:600}
.cx-h{margin:0;font-family:var(--display);font-size:clamp(1.4rem,1rem + 1.4vw,2rem);text-wrap:balance;line-height:1.2;letter-spacing:.02em}
.cx-lede{margin:6px 0 0;max-width:60ch;color:#DCEFF1;font-size:.92rem;line-height:1.6}
.cx-hero>div:first-child{flex:1 1 420px;min-width:0;position:relative;z-index:1}
.cx-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:relative;z-index:1}
.cx-meta>span{font-size:.76rem;color:#DCEFF1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:4px 10px}
.cx-raw.btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);min-height:32px}
.cx-raw[aria-pressed="true"]{background:#fff;color:var(--teal-deep)}
.cx-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
@media(max-width:560px){.cx-kpis{grid-template-columns:1fr 1fr;gap:8px}.cx-kpi{padding:12px}.cx-kval{font-size:1.5rem}}
.cx-kpi{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-lg);padding:14px 16px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden}
.cx-kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--teal-soft)}
.cx-kpi.ok::before{background:var(--cx-good)}.cx-kpi.warn::before{background:#D98A1C}.cx-kpi.bad::before{background:var(--cx-bad)}
.cx-ktop{display:flex;gap:8px;align-items:center;justify-content:space-between}
.cx-klab{font-size:.8rem;color:var(--ink-2);font-weight:600;line-height:1.35}
.cx-kst{flex:none;font-size:.7rem;font-weight:700;border-radius:999px;padding:2px 8px}
.cx-kst.ok{background:var(--ok-soft);color:var(--cx-good)}.cx-kst.warn{background:var(--warn-soft);color:var(--cx-warn)}.cx-kst.bad{background:var(--err-soft);color:var(--cx-bad)}
.cx-kval{font-size:clamp(1.6rem,1.3rem + 1vw,2.1rem);font-weight:700;color:var(--ink);line-height:1.1;letter-spacing:-.01em}
.cx-kval small{font-size:.8rem;font-weight:600;color:var(--ink-3);margin-left:4px;letter-spacing:0}
.cx-delta{font-size:.76rem;font-weight:600;align-self:flex-start;border-radius:6px;padding:1px 6px}
.cx-delta.good{color:var(--cx-good);background:var(--ok-soft)}.cx-delta.bad{color:var(--cx-bad);background:var(--err-soft)}.cx-delta.neu,.cx-delta.flat{color:var(--ink-2);background:var(--wash-2)}
.cx-spark{width:100%;height:28px;margin-top:2px}.cx-spark polyline{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.cx-ksub{margin:0;font-size:.76rem;color:var(--ink-3);line-height:1.45;overflow-wrap:anywhere}
.cx-ins{list-style:none;margin:0;padding:14px 16px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-lg);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:10px 20px}
.cx-ins li{position:relative;padding-left:18px;font-size:.88rem;line-height:1.6;color:var(--ink)}
.cx-ins li::before{content:"";position:absolute;left:2px;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--teal)}
.cx-ins li.good::before{background:var(--cx-good)}.cx-ins li.warn::before{background:#D98A1C;border-radius:2px;transform:rotate(45deg)}
.cx-card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-lg);padding:16px 18px;min-width:0;grid-column:span 12}
@media(min-width:900px){.cx-card{grid-column:span 6}.cx-card.wide{grid-column:1/-1}}
@media(min-width:1100px){.cx-card.third{grid-column:span 4}}
.cx-chead{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.cx-chead>div{flex:1;min-width:0}
.cx-title{margin:0;font-size:1.02rem;line-height:1.4;color:var(--ink)}
.cx-sub{margin:2px 0 0;font-size:.78rem;color:var(--ink-3);line-height:1.5}
.cx-plot{position:relative;width:100%}
.cx-svg{display:block;width:100%;height:auto;overflow:visible}
.cx-grid{stroke:var(--grid);stroke-width:1}
.cx-ax{font-size:11px;fill:var(--ink-3)}
.cx-band{fill:#0F5E6E;opacity:.07}
.cx-cl{stroke:var(--ink-3);stroke-width:1.25;stroke-dasharray:5 4}
.cx-lim{fill:none;stroke:#7FC0C9;stroke-width:1.5;stroke-dasharray:2 3}
.cx-bar{opacity:.9}.cx-bar.partial{opacity:.32}
.cx-line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.cx-dot{stroke:var(--sheet);stroke-width:2}
.cx-dot.sig{fill:#D98A1C;stroke:#fff;stroke-width:2}
.cx-dot.partial{fill:var(--sheet)!important;stroke:var(--ink-3);stroke-dasharray:2 2}
.cx-phase{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:1 3}
.cx-phtx{font-size:10px}
.cx-partx{font-size:10px;fill:var(--ink-3)}
.cx-hit{fill:transparent;cursor:crosshair}
.cx-hit:hover{fill:rgba(15,94,110,.06)}
.cx-tip{position:fixed;z-index:1000;pointer-events:none;max-width:260px;background:#10313B;color:#fff;font-size:.78rem;line-height:1.55;padding:8px 10px;border-radius:8px;box-shadow:0 8px 24px rgba(16,49,59,.25)}
.cx-sigtx{color:#FFD59A;font-weight:600}
.cx-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:.76rem;color:var(--ink-2)}
.cx-legend span{display:inline-flex;align-items:center;gap:6px}
.cx-legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.cx-legend .sw.band{background:rgba(15,94,110,.14);border:1px dashed #7FC0C9}
.cx-legend .sw.sig{background:#D98A1C;border-radius:50%}
.cx-legend .muted{color:var(--ink-3);font-style:italic}
.cx-table{margin-top:8px;font-size:.8rem}
.cx-table summary{cursor:pointer;color:var(--teal);font-weight:600;padding:4px 0;min-height:32px;display:flex;align-items:center}
.cx-table table{width:100%;margin-top:6px}
.cx-table table td,.cx-table table th{text-align:right;padding:4px 8px}.cx-table table td:first-child,.cx-table table th:first-child{text-align:left}
.cx-pareto{display:flex;flex-direction:column;gap:6px}
.cx-prow{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) auto;grid-template-areas:"lab track val" "lab cum cum";gap:2px 10px;align-items:center;padding:4px 0;border-bottom:1px solid var(--rule-2)}
.cx-prow:last-child{border-bottom:0}
.cx-plab{grid-area:lab;font-size:.84rem;color:var(--ink);line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cx-ptrack{grid-area:track;height:12px;background:var(--wash-2);border-radius:6px;overflow:hidden;display:block}
.cx-pbar{display:block;height:100%;background:var(--s1);border-radius:0 6px 6px 0;opacity:.55}
.cx-prow.vital .cx-pbar{opacity:1}.cx-prow.vital .cx-plab{font-weight:600}
.cx-prow.other .cx-pbar{background:#9FB3B9!important}
.cx-pval{grid-area:val;font-size:.86rem;color:var(--ink)}
.cx-pcum{grid-area:cum;font-size:.72rem;color:var(--ink-3)}
.cx-foot{margin:8px 0 0;font-size:.76rem;color:var(--ink-3)}
.cx-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:899px){.cx-board{grid-template-columns:repeat(4,minmax(232px,1fr));overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin:0 -4px;padding-inline:4px}.cx-col{scroll-snap-align:start}}
.cx-col{background:var(--wash-2);border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--teal-soft);min-width:0}
.cx-col.c1{border-top-color:var(--s1)}.cx-col.c2{border-top-color:var(--s2)}.cx-col.c3{border-top-color:var(--s3)}.cx-col.c4{border-top-color:#D98A1C}
.cx-colh{display:flex;align-items:center;justify-content:space-between;font-size:.82rem;color:var(--ink-2)}
.cx-colc{font-size:.72rem;background:var(--sheet);border-radius:999px;padding:1px 8px;color:var(--ink-3);border:1px solid var(--rule)}
.cx-item{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:9px 11px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:baseline;box-shadow:0 1px 0 rgba(16,49,59,.04);transition:transform .15s var(--ease),box-shadow .15s var(--ease)}
.cx-item:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,49,59,.08)}
.cx-item.warn{border-left:3px solid #D98A1C}
.cx-ih{font-size:.8rem;color:var(--ink-2);line-height:1.4;overflow-wrap:anywhere}
.cx-iv{font-size:1rem;color:var(--ink);white-space:nowrap}
.cx-in{grid-column:1/-1;font-size:.72rem;color:var(--ink-3)}
.cx-empty{margin:0;font-size:.78rem;color:var(--ink-3);padding:10px;text-align:center;border:1px dashed var(--rule);border-radius:8px}
.cx-sat{display:flex;flex-direction:column;gap:14px}
.cx-satit{display:grid;grid-template-columns:3.2em auto 1fr;gap:4px 12px;align-items:center}
.cx-satl{font-size:.86rem;font-weight:600;color:var(--ink-2)}
.cx-satit>b{font-size:1.4rem;color:var(--ink)}
.cx-satit .cx-ptrack{height:10px;grid-area:auto}
.cx-card.wide .cx-sat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px 28px}
.cx-satit small{grid-column:1/-1;font-size:.74rem;color:var(--ink-3)}
.cx-mat td{text-align:center;font-size:.86rem}
.cx-small{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin-top:14px}
.cx-mini{border:1px solid var(--rule-2);border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column;gap:2px}
.cx-mini>b{font-size:.84rem}.cx-mini>small{font-size:.72rem;color:var(--ink-3)}
.cx-hatch{stroke:#B9CBD0;stroke-width:2}
.cx-legend .sw.supp{background:repeating-linear-gradient(45deg,#B9CBD0 0 2px,transparent 2px 5px);border:1px solid #D3E0E3}
@media(prefers-reduced-motion:reduce){.cx-item{transition:none}.cx-item:hover{transform:none}}
@media print{.cx-hero{background:#fff;color:var(--ink);border:1px solid var(--rule)}.cx-raw,.cx-table summary{display:none}}
@media(min-width:900px){.cx-card.wide>.cx-pareto{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}.cx-card.wide>.cx-pareto .cx-prow:nth-last-child(2){border-bottom:0}}

<body>

<!-- 登入 -->
<section id="loginView" class="login" hidden>
  <div class="login-stage">
    <div class="login-rx" aria-hidden="true">Rx</div>
    <div class="inner" id="sealWrap">
      <div class="seal huge" aria-hidden="true">桃</div>
      <h1 id="loginTitle">桃e藥師教學歷程</h1>
      <p>教材、評量紀錄與訓練成效，一次查到。</p>
    </div>
  </div>
  <div class="login-panel">
    <div class="login-box">
      <h2>登入</h2>
      <p class="hint">使用已登記的 Google 帳號。沒有權限時，請洽藥劑科教學負責人。</p>
      <div id="gsiBtn"></div>
      <div id="loginMsg" class="msg" role="status" aria-live="polite" hidden></div>
      <ul class="login-what">
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>一個搜尋框查遍教材、諮詢紀錄與評量</span></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg><span>看自己的里程碑、CbD 與 360 度評核</span></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M12 16v4M8 20h8"/></svg><span>在手機上播放簡報、互動教材與計算機</span></li>
      </ul>
      <p class="login-foot">衛生福利部桃園醫院 藥劑科｜資料僅供院內教學使用，請勿翻拍或轉傳。</p>
    </div>
  </div>
</section>

<!-- 主畫面 -->
<div id="appView" hidden>
  <header class="top">
    <div class="top-bar">
      <div class="brand"><span class="seal small" aria-hidden="true">桃</span><b id="brand">桃e藥師教學歷程</b></div>
      <div class="me">
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <span class="who"><b id="whoName"></b><span id="who"></span></span>
      </div>
      <label for="roleSel" class="sr-only">目前角色</label>
      <select id="roleSel" class="rolesel" hidden></select>
      <button class="iconbtn" id="logoutBtn" type="button" aria-label="登出" title="登出">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/></svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <nav class="nav" role="tablist" aria-label="主選單">
      <button class="tab" role="tab" id="tabData" aria-selected="true" aria-controls="dataPanel" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18"/><path d="M10 8h4"/><path d="M10 16h4"/></svg>
        <span>資料查詢</span></button>
      <button class="tab" role="tab" id="tabDash" aria-selected="false" aria-controls="dashPanel" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
        <span>成效儀表板</span></button>
      <button class="tab" role="tab" id="tabPages" aria-selected="false" aria-controls="pagesPanel" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 8h5"/></svg>
        <span>教材與工具</span></button>
      <button class="tab" role="tab" id="tabImp" aria-selected="false" aria-controls="impPanel" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/></svg>
        <span>改善追蹤</span></button>
    </nav>

    <main>
      <section id="dataPanel" role="tabpanel" aria-labelledby="tabData">
        <div class="searchbar" id="searchbar">
          <div class="searchbox">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <label for="q" class="sr-only">搜尋關鍵字</label>
            <input id="q" type="search" placeholder="搜尋藥名、教材、姓名…" autocomplete="off" enterkeyhint="search">
            <button class="iconbtn clear" id="qClear" type="button" aria-label="清除搜尋" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          </div>
          <div class="scope">
            <label for="scope" class="sr-only">搜尋範圍</label>
            <select id="scope"></select>
          </div>
        </div>
        <div class="progress" id="progress" hidden><span id="progressText"></span><div class="bar"><i id="progressBar"></i></div></div>
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <div id="dataView"></div>
      </section>

      <section id="dashPanel" role="tabpanel" aria-labelledby="tabDash" class="viz" hidden>
        <div class="bi-head">
          <div class="bi-cats" id="dashCats" role="tablist" aria-label="儀表板類別"></div>
          <div class="bi-pages" id="dashTabs" role="tablist" aria-label="儀表板頁面" hidden></div>
          <label for="dashSel" class="sr-only">選擇儀表板</label>
          <select id="dashSel" hidden></select>
        </div>
        <div class="dash-top bi-slicers">
          <div class="bi-crumb" id="dashCrumb"></div>
          <label class="slicer"><span>年度</span><select id="yearSel"></select></label>
          <label class="slicer"><span>月份</span><select id="monthSel"></select></label>
          <label class="slicer subj"><span>對象（個人圖表）</span><select id="subjSel" hidden></select></label>

<script>

/* ---------- 錯誤可視化（v2.1.1）：任何未處理錯誤改為畫面提示，不再留白 ---------- */

var APP_VERSION = '2.14.0';
var $ = function (id) { return document.getElementById(id); };
var S = {
  session: null, user: null, catalog: null, data: {}, loadingKeys: {}, failedKeys: {},

/* ---------- 後端呼叫 ---------- */
function api(action, payload) {
  var body = Object.assign({ action: action }, payload || {});

function apiError(code, message) { var e = new Error(message); e.code = code; return e; }

/* ---------- 登入 ---------- */
function saveSession() {

}
function loadSession() {
  try { var j = JSON.parse(sessionStorage.getItem('taoe_s') || 'null'); if (j && j.s) { S.session = j.s; S.user = j.u; } } catch (e) { /* 忽略 */ }
}
function clearSession() { S.session = null; S.user = null; try { sessionStorage.removeItem('taoe_s'); } catch (e) { /* 忽略 */ } }

function showLogin(msg, kind) {
  $('appView').hidden = true; $('loginView').hidden = false;
  closeDrawer(true); closeViewer(true);
  var m = $('loginMsg');
  if (msg) { m.hidden = false; m.className = 'msg ' + (kind || 'info'); m.textContent = msg; } else { m.hidden = true; }
}
function onAuthLost(err) {

  showLogin(err.message, 'err');
  initGsi();
}

var gsiReady = false, clientId = '';
function initGsi() {
  if (!clientId) return;
  function go() {
    if (!window.google || !google.accounts || !google.accounts.id) return;
    if (!gsiReady) {
      google.accounts.id.initialize({ client_id: clientId, callback: onCredential, auto_select: true, cancel_on_tap_outside: false, use_fedcm_for_prompt: true });
      gsiReady = true;
    }
    var box = $('gsiBtn'); box.innerHTML = '';
    google.accounts.id.renderButton(box, { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', locale: 'zh-TW', width: Math.min(320, box.clientWidth || 320) });
  }
  if (window.google && google.accounts) { go(); return; }
  if (!document.getElementById('gsiScript')) {
    var s = document.createElement('script');
    s.id = 'gsiScript'; s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.defer = true;

    document.head.appendChild(s);

}

function onCredential(resp) {
  showLogin('驗證中…', 'info');
  api('login', { credential: resp && resp.credential }).then(function (j) {
    S.session = j.session; S.user = j.bootstrap; saveSession();
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    $('sealWrap').classList.add('stamped');

    setTimeout(function () { $('sealWrap').classList.remove('stamped'); startApp(); }, reduce ? 0 : 520);
  }).catch(function (e) {
    if (e.code !== 'AUTH_REQUIRED' && e.code !== 'ACCESS_DENIED') showLogin(e.message, 'err');

$('logoutBtn').addEventListener('click', function () {
  var s = S.session;
  clearSession();
  if (s) fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ action: 'logout', session: s }) }).catch(function () {});

/* ---------- 啟動 ---------- */
function boot() {

/* 目錄前處理：已併入成效儀表板的分頁不在「資料查詢」列出（僅介面隱藏，不是權限設定）；同一主題的來源合併顯示 */
function prepCatalog(j) {
  j.sheets = (j.sheets || []).filter(function (s) { return !QUERY_HIDDEN[s.key] && !(QUERY_HIDDEN_TITLES[s.title] && /多元評量/.test(s.source || '')); });
  var baseSrc = {}; (j.sheets || []).forEach(function (s) { baseSrc[s.source] = 1; });
  (j.sheets || []).forEach(function (s) { var b = String(s.source || '').replace(/\s*（[^）]*）\s*$/, ''); if (b && b !== s.source && baseSrc[b]) { s.sourceFull = s.source; s.source = b; } });
  return j;
}

/* ---------- 資料新鮮度：後台重建資料後，前台自動偵測並更新（v2.10） ----------
   1. 網頁開著時每 5 分鐘、或從其他分頁切回本頁時，向後台查詢一次目錄，比對各分頁的「資料更新時間」。
   2. 有變動且使用者約 1 分鐘內沒有操作 → 清除前台暫存並重畫目前畫面，頂端提示「資料已更新」。
      使用者正在操作（篩選、放大檢視、閱讀全文、輸入搜尋）→ 只顯示「有新資料，點此更新」，不打斷畫面。
   3. 網站本身（index.html）換版時，提示重新載入。 */
var FRESH = { every: 5 * 60 * 1000, sig: '', busy: false, last: 0, timer: null, pending: null, act: 0, etag: '', verChecked: false };
function freshSig(cat) { var a = (cat.sheets || []).map(function (x) { return String(x.updated || ''); }).filter(Boolean).sort(); return a.length ? a[a.length - 1] + '#' + a.length + '#' + a.join('').length : ''; }
function freshLatest(cat) { var a = (cat.sheets || []).map(function (x) { return String(x.updated || ''); }).filter(Boolean).sort(); return a.length ? a[a.length - 1] : ''; }
function freshBusyUser() {
  if (Date.now() - FRESH.act < 60000) return true;
  if (document.querySelector('.chart.focused')) return true;
  var dr = $('drawer'); if (dr && !dr.hidden) return true;
  var ae = document.activeElement; if (ae && (ae.id === 'q' || /^(SELECT|INPUT|TEXTAREA)$/.test(ae.tagName))) return true;
  return false;
}
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (ev) { document.addEventListener(ev, function () { FRESH.act = Date.now(); }, { passive: true, capture: true }); });
function freshBar(msg, btnText, onBtn, sticky) {
  var b = $('freshBar');
  if (!b) { b = document.createElement('div'); b.id = 'freshBar'; b.className = 'fresh-bar'; b.setAttribute('role', 'status'); b.setAttribute('aria-live', 'polite'); document.body.appendChild(b); }
  clearTimeout(b._t); b.innerHTML = ''; b.hidden = false;
  var ic = document.createElement('span'); ic.className = 'fresh-dot'; ic.setAttribute('aria-hidden', 'true'); b.appendChild(ic);
  b.appendChild(document.createTextNode(msg));
  if (btnText) { var bt = document.createElement('button'); bt.type = 'button'; bt.className = 'fresh-btn'; bt.textContent = btnText; bt.addEventListener('click', function () { b.hidden = true; onBtn(); }); b.appendChild(bt); }
  var x = document.createElement('button'); x.type = 'button'; x.className = 'fresh-x'; x.setAttribute('aria-label', '關閉提示'); x.textContent = '×'; x.addEventListener('click', function () { b.hidden = true; }); b.appendChild(x);
  b.classList.toggle('sticky', !!sticky);

}
function freshCheck(force) {
  if (!S.session || !S.catalog || FRESH.busy) return Promise.resolve();
  if (!force && document.hidden) return Promise.resolve();
  if (!force && Date.now() - FRESH.last < 60000) return Promise.resolve();
  FRESH.busy = true; FRESH.last = Date.now();
  freshCheckApp();
  return api('catalog').then(function (j) {
    var sig = freshSig(j); if (!sig) return;
    if (!FRESH.sig) { FRESH.sig = sig; return; }

    FRESH.pending = { j: j, sig: sig };

    else freshApply();
  }).catch(function () { /* 網路或權限暫時失敗：下次再試，不打擾使用者 */ }).then(function () { FRESH.busy = false; });
}
function freshApply() {

  FRESH.sig = P.sig;

  S.data = {}; S.failedKeys = {}; S.loadingKeys = {}; S.ovCache = {};
  if (typeof AX !== 'undefined') { AX.cache = {}; AX.pending = {}; AX.resolved = null; }
  var oldDash = (S.catalog.dashboards || []).map(function (d) { return d.id + d.name; }).join('|');
  S.catalog = prepCatalog(P.j);
  buildScope(); buildPages();
  if ((S.catalog.dashboards || []).map(function (d) { return d.id + d.name; }).join('|') !== oldDash) { var keep = S.dashId; buildDashList(); if (keep && dashItem(keep)) { S.dashId = keep; S.dashCat = catOfId(keep); renderDashNav(); } }
  var dashOn = !$('dashPanel').hidden;
  if (dashOn && S.dashId) {
    if (S.dashId === OVERVIEW_ID || S.dashId.indexOf(OVERVIEW_ID + ':') === 0) renderOverview(S.dashCat); else loadDashboard(false);
  }
  render(); preloadAll();
  freshBar('資料已更新' + (oldTime && newTime ? '（' + oldTime.slice(5) + ' → ' + newTime.slice(5) + '）' : ''), '', null, false);
}
/* 網站換版偵測：比對伺服器上的 index.html 版本號 */
function freshCheckApp() {
  if (!window.fetch || location.protocol === 'file:') return;
  var url = location.pathname + (location.pathname.slice(-1) === '/' ? '' : '');
  var getVer = function () {
    return fetch(url + '?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { FRESH.etag = r.headers.get('etag') || FRESH.etag; return r.text(); }).then(function (t) {
      var m = /var APP_VERSION = '([\d.]+)'/.exec(t); if (m && m[1] !== APP_VERSION) freshBar('網站已更新為 v' + m[1] + '（目前 v' + APP_VERSION + '）', '重新載入', function () { location.reload(); }, true);
    });
  };
  if (!FRESH.verChecked) { FRESH.verChecked = true; getVer().catch(function () {}); return; }

  FRESH.timer = setInterval(function () { freshCheck(false); }, FRESH.every);
}
document.addEventListener('visibilitychange', function () { if (!document.hidden) { freshCheck(false); if (FRESH.pending && !freshBusyUser()) freshApply(); } });

function startApp() {
  $('loginView').hidden = true; $('appView').hidden = false;
  showUser();
  setStatus('');
  skeletonView();
  api('catalog').then(function (j) {
    FRESH.sig = freshSig(j);
    S.catalog = prepCatalog(j);
    if (j.bootstrap) { S.user = j.bootstrap; saveSession(); showUser(); }
    var sn = j.bootstrap && j.bootstrap.ui_config && j.bootstrap.ui_config.siteName;
    if (sn) { S.siteName = sn; document.title = sn; $('brand').textContent = sn; }
    $('tabImp').hidden = !(S.user.capabilities && S.user.capabilities.can_read_improvement);
    buildScope();
    buildPages();
    buildDashList();
    render();
    preloadAll();
    freshStart();
  }).catch(function (e) {
    if (e.code === 'AUTH_REQUIRED' || e.code === 'ACCESS_DENIED') return;
    if (e.code === 'SYSTEM_NOT_ACTIVATED') { stateView('', '系統正在上線檢查，暫不提供資料。您的帳號與角色已確認，啟用後即可使用。'); return; }

function isLearnerRole() { var r = S.user && S.user.active_role; return r === 'STUDENT' || r === 'TRAINEE'; }
function showUser() {
  var u = S.user || {};
  document.body.classList.toggle('self-tone', isLearnerRole()); // 只影響配色，不決定可見內容（可見內容一律由伺服器授權）
  var name = u.display_name || (u.email || '').split('@')[0];

  $('whoName').textContent = name || '';

  w.appendChild(document.createTextNode(u.email || ''));
  $('avatar').title = (u.display_name ? u.display_name + '｜' : '') + (u.email || '');
  var rs = $('roleSel'), roles = u.available_roles || [];
  rs.innerHTML = '';
  roles.forEach(function (x) { var o = document.createElement('option'); o.value = x.id; o.textContent = '以「' + x.label + '」身分'; rs.appendChild(o); });

  var want = this.value;

    S.user = j.bootstrap; saveSession();

/* 各來源的辨識色（同一來源在目錄、結果、詳細資料一致） */
var SRC_COLORS = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#4a3aa7', '#e34948'];
function srcColor(name) {
  var list = []; (S.catalog && S.catalog.sheets || []).forEach(function (s) { if (list.indexOf(s.source) < 0) list.push(s.source); });
  var i = list.indexOf(name); return SRC_COLORS[(i < 0 ? 0 : i) % SRC_COLORS.length];
}
function dot(name) { var i = document.createElement('i'); i.style.background = srcColor(name); i.setAttribute('aria-hidden', 'true'); return i; }

function skeletonView() {

  var sk = document.createElement('div'); sk.className = 'skel'; sk.setAttribute('aria-label', '載入中');
  for (var i = 0; i < 5; i++) sk.appendChild(document.createElement('div'));

/* ---------- 空狀態詞彙（§69：不得一律「查無資料」） ---------- */
var EMPTY_TEXT = {
